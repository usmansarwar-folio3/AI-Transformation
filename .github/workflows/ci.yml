name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - dev

jobs:
  bug-bazaar:
    name: Bug Bazaar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bug-bazaar

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: bug-bazaar/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc -b

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
